name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore PlottR0.2.slnx

      - name: Build
        run: dotnet build PlottR0.2.slnx --configuration Release --no-restore

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Run tests with coverage
        run: >-
          dotnet test PlottR0.2.slnx
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --settings coverage.runsettings
          --results-directory ./coverage/results

      - name: Generate coverage report
        run: >-
          dotnet reportgenerator
          -reports:"./coverage/results/**/coverage.cobertura.xml"
          -targetdir:./coverage/report
          -reporttypes:'HtmlInline_AzurePipelines_Dark;Cobertura;TextSummary'
          -verbosity:Info

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage/report
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  deploy:
    name: Deploy to Render
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy hooks are configured
        env:
          API_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
          WEB_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
        run: |
          [ -n "$API_HOOK" ] || { echo "::error::RENDER_DEPLOY_HOOK_API secret is not set"; exit 1; }
          [ -n "$WEB_HOOK" ] || { echo "::error::RENDER_DEPLOY_HOOK_WEB secret is not set"; exit 1; }

      - name: Deploy API
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}"

      - name: Deploy Web
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_WEB }}"
