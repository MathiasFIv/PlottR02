services:
  # ---------- API (Docker web service, FREE plan) ----------
  - type: web
    name: plottr-api
    runtime: docker
    region: frankfurt            # pick nearest; keep consistent with the Neon region
    plan: free                   # 512 MB / 0.1 CPU; spins down after 15 min idle; no disk
    branch: dev                  # v1 deploy branch = dev (internal testing; CI already targets dev)
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 30
    # NOTE: no `disk:` block — persistent disks are unavailable on the free plan.
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Storage__Root
        value: /var/data         # LOCAL WRITE-THROUGH CACHE only; durable copy lives in Neon Object Storage
      - key: ConnectionStrings__PlottR02
        sync: false              # set in dashboard (Neon POOLED string, keyword=value)
      - key: Jwt__SecretKey
        generateValue: true      # 32+ byte random, generated by Render
      - key: Jwt__Issuer
        value: plottr-api
      - key: Jwt__Audience
        value: plottr-web
      - key: Jwt__AccessTokenExpirationMinutes
        value: "15"
      - key: Jwt__RefreshTokenExpirationDays
        value: "7"
      - key: AllowedOrigins__0
        value: https://plottr-web.onrender.com   # web origin
      # ---- Object storage: durable workbooks + recordings ----
      - key: ObjectStorage__Enabled
        value: "true"
      - key: ObjectStorage__Provider
        value: NeonObjectStorage  # NeonObjectStorage | BackblazeB2 | CloudflareR2 | Tigris | None
      - key: ObjectStorage__Bucket
        sync: false              # private bucket name (e.g. plottr-artifacts)
      - key: ObjectStorage__Endpoint
        sync: false              # PLACEHOLDER: https://<branch-id>.storage.<region>.aws.neon.tech
      - key: ObjectStorage__Region
        sync: false              # SDK region value (Neon region aws-eu-central-1 => value eu-central-1)
      - key: ObjectStorage__AccessKeyId
        sync: false              # SECRET: S3-compatible key id (Neon credential system)
      - key: ObjectStorage__SecretAccessKey
        sync: false              # SECRET: S3-compatible secret
      - key: ObjectStorage__ForcePathStyle
        value: "true"            # Neon Object Storage requires path-style addressing
      # ---- STT: Cloudflare Workers AI (Path A, direct REST) ----
      - key: CloudflareAi__AccountId
        sync: false              # Cloudflare account id (not secret)
      - key: CloudflareAi__ApiToken
        sync: false              # SECRET: Workers AI API token
      - key: CloudflareAi__Model
        value: "@cf/openai/whisper-large-v3-turbo"
      - key: CloudflareAi__TimeoutSeconds
        value: "120"
      # NOTE: FasterWhisper__* is LOCAL DEV ONLY (the Python sidecar). Do not set it in prod.

  # ---------- Web (static site, FREE) ----------
  - type: web
    name: plottr-web
    runtime: static
    branch: dev
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://plottr-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
